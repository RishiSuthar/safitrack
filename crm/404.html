<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    (function () {
      var path = window.location.pathname || '';
      var hasFileExt = /\.[a-zA-Z0-9]+$/.test(path);
      if (path.startsWith('/crm/') && !hasFileExt) {
        var target = '/crm/index.html?__route=' + encodeURIComponent(path);
        window.location.replace(target);
        return;
      }
      window.location.replace('/crm/index.html');
    })();
  </script>
</head>
<body></body>
</html>
