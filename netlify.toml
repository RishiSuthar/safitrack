# The comparison page was retired; send old links home.
[[redirects]]
  from = "/pages/comparison.html"
  to = "/"
  status = 301

# Reminders were removed from the product; tasks cover follow-ups.
[[redirects]]
  from = "/pages/features/reminders-feature.html"
  to = "/pages/features/tasks-feature.html"
  status = 301

# Database and edge-function source is not part of the website.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/crm/*"
  to = "/crm/index.html"
  status = 200
